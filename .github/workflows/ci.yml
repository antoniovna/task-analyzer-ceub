# Pipeline de CI — contrato na seção 4.4 de specs/task_analyzer_spec.md.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-harness:
    name: Test Harness (Python 3.11)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Test Harness com cobertura
        run: >-
          pytest tests/test_harness.py -v
          --cov=src --cov-report=term-missing --cov-fail-under=90

  docker:
    name: Test Harness no contêiner (python:3.11-slim)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Construir a imagem
        run: docker compose build tests

      - name: Executar a suíte no contêiner
        run: docker compose run --rm tests
